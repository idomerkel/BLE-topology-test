<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>מיפוי מצלמה — FocusHLS (WebView)</title>
<!--
  ════════════════════════════════════════════════════════════════════════
  FocusHLS — מיפוי מצלמה מבוסס WebView (תחליף ל-ARCore).  build = "web-map-v1"
  ════════════════════════════════════════════════════════════════════════
  למה זה קיים:
    ARCore נכשל על מכשירי סמסונג עם Android 16 / Play Services for AR 1.54
    ("Failed to register sensor to queue 0" — באג פתוח אצל Google, ראה
    arcore-android-sdk issues #1762 / #1763). המסך הזה עוקף את ARCore לגמרי:
    מצלמה חיה דרך getUserMedia (בדיוק כמו צילום הסיור שכבר עובד אצלך),
    כיוון (yaw) דרך חיישני הכיוון של הדפדפן, ולכידת תת-מיקום שמשלבת כיוון+BLE.

  מה זה נותן לעומת ARCore:
    ✓ עובד בכל מכשיר, בלי תלות בגרסת Google.
    ✓ קוד DEV בלבד (נטען מ-focushls-dev.web.app) — לא נוגע ב-LIVE ולא ב-Kotlin.
    ✗ אין מיקום מטרי מדויק (x,y,z אמיתי). המיפוי מבוסס כיוון + BLE, ואופציונלית
      הערכת מרחק/צעדים גסה מתאוצה. מספיק לזיהוי/כיול תת-מיקומים.

  אבטחה: getUserMedia + חיישני כיוון דורשים HTTPS (secure context). זה יעבוד
    כשהקובץ מוגש מ-focushls-dev.web.app. פתיחה כ-file:// בטלפון עלולה לחסום מצלמה.

  אינטגרציה (3 נקודות חיבור בלבד — מוגדרות ב-window.FocusHLSMapping):
    runBleScan()          → מחזיר Promise<[{mac,rssi}]> מסריקת ה-BLE הקיימת שלך.
    saveSubLocation(rec)  → שומר רשומת תת-מיקום (loc, sub, heading, ble, ts, dist?).
    onClose()             → נסגר/חוזר למסך הכיול (למשל AndroidAR חוזר ל-WebView).
  אם הן לא מוגדרות — המסך עובד במצב הדגמה (מדפיס JSON למסך).
-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
  }
  #cam {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000; z-index: 0;
  }
  .overlay { position: fixed; z-index: 2; }
  #status {
    top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
    background: linear-gradient(#000c, #0000);
    font-size: 15px; line-height: 1.4;
  }
  #status .head { font-weight: 700; }
  #status .sub  { opacity: .85; font-size: 13px; margin-top: 2px; }
  #compass {
    top: calc(env(safe-area-inset-top, 0px) + 78px); left: 50%;
    transform: translateX(-50%);
    background: #000a; border: 1px solid #ffffff30; border-radius: 999px;
    padding: 8px 18px; font-size: 20px; font-weight: 700; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
  }
  #compass .needle { font-size: 22px; }
  #flip {
    top: calc(env(safe-area-inset-top, 0px) + 74px); right: 14px;
    width: 46px; height: 46px; padding: 0; flex: none;
    background: #000a; border: 1px solid #ffffff30; border-radius: 999px;
    font-size: 20px; color: #fff;
  }
  #flip:active { background: #ffffff30; }
  #controls {
    bottom: 0; left: 0; right: 0;
    padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
    background: linear-gradient(#0000, #000c);
    display: flex; flex-direction: column; gap: 12px;
  }
  #subName {
    width: 100%; padding: 13px 14px; border-radius: 12px;
    border: 1px solid #ffffff40; background: #000a; color: #fff;
    font-size: 16px; text-align: right;
  }
  #subName::placeholder { color: #ffffff80; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  button {
    border: none; border-radius: 14px; font-size: 17px; font-weight: 700;
    padding: 15px 10px; color: #fff; cursor: pointer; flex: 1;
  }
  #capture { background: #1e88e5; }
  #capture:active { background: #1565c0; }
  #capture:disabled { background: #4a4a4a; opacity: .7; }
  #done { background: #ffffff26; flex: 0 0 96px; }
  #done:active { background: #ffffff40; }
  .optrow {
    display: flex; align-items: center; gap: 8px; justify-content: center;
    font-size: 13px; opacity: .9;
  }
  .optrow input { width: 18px; height: 18px; }
  #log {
    position: fixed; z-index: 2; left: 12px; right: 12px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 190px);
    max-height: 34vh; overflow-y: auto;
    background: #000b; border: 1px solid #ffffff20; border-radius: 10px;
    padding: 8px 10px; font-size: 12px; line-height: 1.5;
    direction: ltr; text-align: left; display: none;
  }
  #log.show { display: block; }
  #log .ok  { color: #7ee787; }
  #log .err { color: #ff7b72; }
  #toast {
    position: fixed; z-index: 5; left: 50%; bottom: 45%;
    transform: translateX(-50%);
    background: #000d; border: 1px solid #ffffff30; border-radius: 12px;
    padding: 12px 18px; font-size: 15px; max-width: 86vw; text-align: center;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>

  <div id="status" class="overlay">
    <div class="head" id="statusHead">מאתחל מצלמה…</div>
    <div class="sub"  id="statusSub">אנא אשר גישה למצלמה ולחיישני התנועה</div>
  </div>

  <div id="compass" class="overlay">
    <span class="needle">🧭</span><span id="headingText">--°</span>
  </div>

  <button id="flip" class="overlay" title="החלף מצלמה">🔄</button>

  <div id="log" class="overlay"></div>

  <div id="controls" class="overlay">
    <input id="subName" type="text" placeholder="שם תת-מיקום (למשל: לובי A / קומה 2 מזרח)">
    <div class="optrow">
      <input type="checkbox" id="distToggle">
      <label for="distToggle">מדידת מרחק/צעדים מנקודת ההתחלה (ניסיוני)</label>
    </div>
    <div class="row">
      <button id="capture" disabled>לכוד תת-מיקום</button>
      <button id="done">סיום</button>
    </div>
  </div>

  <div id="toast"></div>

<script>
"use strict";
(function () {
  // ─────────────────────────────────────────────────────────────────────
  // הגדרות + עזרים
  // ─────────────────────────────────────────────────────────────────────
  var params   = new URLSearchParams(location.search);
  var LOC_NAME  = params.get("loc") || (window.FocusHLSMapping && window.FocusHLSMapping.locationName) || "";

  var els = {
    cam:        document.getElementById("cam"),
    statusHead: document.getElementById("statusHead"),
    statusSub:  document.getElementById("statusSub"),
    compass:    document.getElementById("compass"),
    headingTxt: document.getElementById("headingText"),
    subName:    document.getElementById("subName"),
    capture:    document.getElementById("capture"),
    done:       document.getElementById("done"),
    distToggle: document.getElementById("distToggle"),
    flip:       document.getElementById("flip"),
    log:        document.getElementById("log"),
    toast:      document.getElementById("toast"),
  };

  var state = {
    heading: null,        // מעלות 0..360, 0 = צפון
    headingRaw: null,
    haveOrientation: false,
    camReady: false,
    origin: null,         // {x,y} מטרים משוערים לנקודת ההתחלה (למדידת מרחק)
    pos: { x: 0, y: 0 },  // מיקום יחסי משוער (מטרים) — רק אם מדידת מרחק פעילה
  };

  function toast(msg, ms) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { els.toast.classList.remove("show"); }, ms || 2200);
  }
  function logLine(msg, cls) {
    els.log.classList.add("show");
    var d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = msg;
    els.log.appendChild(d);
    els.log.scrollTop = els.log.scrollHeight;
  }

  // ─────────────────────────────────────────────────────────────────────
  // מצלמה (getUserMedia) — מצלמה אחורית
  // ─────────────────────────────────────────────────────────────────────
  var currentFacing = "environment";   // ברירת מחדל: מצלמה אחורית
  function stopStream() {
    try {
      var s = els.cam.srcObject;
      if (s) s.getTracks().forEach(function (t) { t.stop(); });
    } catch (e) {}
    els.cam.srcObject = null;
  }
  function attachStream(stream) {
    els.cam.srcObject = stream;
    state.camReady = true;
    refreshStatus();
  }
  function gum(c) { return navigator.mediaDevices.getUserMedia(c); }
  function camErr(e) { failCamera((e && e.name) || "שגיאת מצלמה"); }

  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      failCamera("הדפדפן לא תומך במצלמה (getUserMedia)");
      return;
    }
    stopStream();
    if (currentFacing === "user") {
      gum({ audio: false, video: { facingMode: { exact: "user" } } })
        .then(attachStream)
        .catch(function () { gum({ audio: false, video: true }).then(attachStream).catch(camErr); });
      return;
    }
    // אחורית: 1) exact environment  2) בחירה לפי deviceId  3) נפילה חיננית
    gum({ audio: false, video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } })
      .then(attachStream)
      .catch(function () { pickBackByDeviceId(); });
  }
  function pickBackByDeviceId() {
    // labels נחשפים רק אחרי הרשאה: פותחים זרם זמני, ממיינים, ובוחרים את האחורית
    gum({ audio: false, video: true })
      .then(function (tmp) {
        return navigator.mediaDevices.enumerateDevices().then(function (devs) {
          var cams = devs.filter(function (d) { return d.kind === "videoinput"; });
          var back = cams.filter(function (d) { return /back|rear|environment|world|背/i.test(d.label || ""); })[0];
          if (!back && cams.length > 1) back = cams[cams.length - 1]; // לרוב האחרונה היא האחורית
          tmp.getTracks().forEach(function (t) { t.stop(); });
          var c = back ? { audio: false, video: { deviceId: { exact: back.deviceId } } }
                       : { audio: false, video: { facingMode: "environment" } };
          return gum(c);
        });
      })
      .then(attachStream)
      .catch(function () { gum({ audio: false, video: true }).then(attachStream).catch(camErr); });
  }
  function flipCamera() {
    currentFacing = (currentFacing === "environment") ? "user" : "environment";
    toast(currentFacing === "environment" ? "מצלמה אחורית" : "מצלמה קדמית");
    startCamera();
  }
  function failCamera(reason) {
    els.statusHead.textContent = "לא ניתן לפתוח מצלמה";
    els.statusSub.textContent  = reason + " — ודא הרשאת מצלמה ושהעמוד מוגש ב-HTTPS";
    logLine("[camera] " + reason, "err");
  }

  // ─────────────────────────────────────────────────────────────────────
  // כיוון / מצפן (DeviceOrientation)
  // ─────────────────────────────────────────────────────────────────────
  function computeHeading(ev) {
    var h = null;
    if (typeof ev.webkitCompassHeading === "number") {
      h = ev.webkitCompassHeading;           // iOS — כבר מעלות בכיוון השעון מצפון
    } else if (ev.alpha != null) {
      h = 360 - ev.alpha;                     // Android absolute — קירוב לכיוון צפון
    }
    if (h == null) return null;
    // פיצוי על סיבוב המסך (portrait/landscape)
    var so = (screen.orientation && typeof screen.orientation.angle === "number")
              ? screen.orientation.angle
              : (window.orientation || 0);
    h = (h + so) % 360;
    if (h < 0) h += 360;
    return h;
  }
  // החלקה מעגלית כדי להקטין רעש
  function smoothHeading(newH) {
    if (state.headingRaw == null) { state.headingRaw = newH; return newH; }
    var diff = ((newH - state.headingRaw + 540) % 360) - 180;
    state.headingRaw = (state.headingRaw + diff * 0.25 + 360) % 360;
    return state.headingRaw;
  }
  function onOrientation(ev) {
    var h = computeHeading(ev);
    if (h == null) return;
    state.heading = smoothHeading(h);
    state.haveOrientation = true;
    els.headingTxt.textContent = Math.round(state.heading) + "° " + compassLabel(state.heading);
    refreshStatus();
  }
  function compassLabel(h) {
    var dirs = ["צפון","צ-מז","מזרח","ד-מז","דרום","ד-מע","מערב","צ-מע"];
    return dirs[Math.round(h / 45) % 8];
  }
  function startOrientation() {
    // iOS 13+ דורש בקשת הרשאה מפורשת; אנדרואיד לא.
    var DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === "function") {
      DOE.requestPermission()
        .then(function (r) { if (r === "granted") bindOrientation(); else logLine("[orient] permission " + r, "err"); })
        .catch(function (e) { logLine("[orient] " + e, "err"); });
    } else {
      bindOrientation();
    }
  }
  function bindOrientation() {
    if ("ondeviceorientationabsolute" in window) {
      window.addEventListener("deviceorientationabsolute", onOrientation, true);
    }
    window.addEventListener("deviceorientation", onOrientation, true);
  }

  // ─────────────────────────────────────────────────────────────────────
  // מדידת מרחק ניסיונית (DeviceMotion → ספירת צעדים גסה)
  // ─────────────────────────────────────────────────────────────────────
  var motion = { last: 0, lastPeak: 0, steps: 0, STRIDE: 0.7 /* מ' לצעד */ };
  function onMotion(ev) {
    var a = ev.accelerationIncludingGravity || ev.acceleration;
    if (!a) return;
    var mag = Math.sqrt((a.x||0)*(a.x||0) + (a.y||0)*(a.y||0) + (a.z||0)*(a.z||0));
    // גילוי צעד פשוט: חציית סף כלפי מעלה עם השהיה מינימלית
    var now = Date.now();
    if (mag > 12 && (now - motion.lastPeak) > 300) {
      motion.lastPeak = now;
      motion.steps++;
      // צעד אחד בכיוון הנוכחי
      var rad = ((state.heading || 0)) * Math.PI / 180;
      state.pos.x += Math.sin(rad) * motion.STRIDE;
      state.pos.y += Math.cos(rad) * motion.STRIDE;
    }
  }
  function startMotion() {
    var DME = window.DeviceMotionEvent;
    if (DME && typeof DME.requestPermission === "function") {
      DME.requestPermission().then(function (r) { if (r === "granted") window.addEventListener("devicemotion", onMotion, true); });
    } else if (DME) {
      window.addEventListener("devicemotion", onMotion, true);
    }
    // אפס נקודת התחלה בכל הפעלה של המדידה
    state.pos = { x: 0, y: 0 };
    motion.steps = 0;
    toast("מדידת מרחק הופעלה — הנקודה הנוכחית היא נקודת האפס");
  }

  // ─────────────────────────────────────────────────────────────────────
  // סטטוס משולב
  // ─────────────────────────────────────────────────────────────────────
  function refreshStatus() {
    if (!state.camReady) {
      els.statusHead.textContent = "מאתחל מצלמה…";
      els.statusSub.textContent  = "אנא אשר גישה למצלמה";
      els.capture.disabled = true;
      return;
    }
    if (!state.haveOrientation) {
      els.statusHead.textContent = "מכייל מצפן…";
      els.statusSub.textContent  = "הזז את הטלפון בתנועת ∞ (שמונה) לרגע";
      els.capture.disabled = false; // אפשר ללכוד גם בלי כיוון (יישמר null)
      return;
    }
    els.statusHead.textContent = "מוכן ✓ — כוון את המצלמה אל תת-המיקום ולחץ \"לכוד\"" + (LOC_NAME ? "  (" + LOC_NAME + ")" : "");
    els.statusSub.textContent  = "כיוון נוכחי: " + Math.round(state.heading) + "°";
    els.capture.disabled = false;
  }

  // ─────────────────────────────────────────────────────────────────────
  // לכידה + שמירה
  // ─────────────────────────────────────────────────────────────────────
  function onCapture() {
    var sub = (els.subName.value || "").trim();
    if (!sub) { toast("הזן שם תת-מיקום לפני הלכידה"); els.subName.focus(); return; }

    els.capture.disabled = true;
    els.capture.textContent = "סורק BLE…";

    var rec = {
      loc: LOC_NAME,
      sub: sub,
      heading: state.heading == null ? null : Math.round(state.heading * 10) / 10,
      ts: Date.now(),
      ble: []
    };
    if (els.distToggle.checked) {
      rec.dist = Math.round(Math.sqrt(state.pos.x*state.pos.x + state.pos.y*state.pos.y) * 100) / 100;
      rec.rel  = { x: Math.round(state.pos.x*100)/100, y: Math.round(state.pos.y*100)/100, steps: motion.steps };
    }

    var api = window.FocusHLSMapping || {};
    var bleP = (typeof api.runBleScan === "function") ? api.runBleScan() : Promise.resolve([]);

    Promise.resolve(bleP)
      .then(function (ble) {
        rec.ble = Array.isArray(ble) ? ble : [];
        var saveP = (typeof api.saveSubLocation === "function") ? api.saveSubLocation(rec) : Promise.resolve();
        return Promise.resolve(saveP).then(function () { return rec; });
      })
      .then(function (saved) {
        logLine("✓ נלכד: " + JSON.stringify(saved), "ok");
        toast("נלכד \"" + saved.sub + "\" ✓  (BLE: " + saved.ble.length + ")");
        els.subName.value = "";
      })
      .catch(function (e) {
        logLine("✗ שגיאה: " + (e && e.message || e), "err");
        toast("שגיאה בלכידה — ראה יומן");
      })
      .then(function () {
        els.capture.disabled = false;
        els.capture.textContent = "לכוד תת-מיקום";
      });
  }

  function onDone() {
    try {
      var s = els.cam.srcObject;
      if (s) s.getTracks().forEach(function (t) { t.stop(); });
    } catch (e) {}
    var api = window.FocusHLSMapping || {};
    if (typeof api.onClose === "function") api.onClose();
    else logLine("[done] onClose לא הוגדר — במצב אמת יחזור למסך הכיול", "ok");
  }

  // ─────────────────────────────────────────────────────────────────────
  // חיווט
  // ─────────────────────────────────────────────────────────────────────
  els.capture.addEventListener("click", onCapture);
  els.done.addEventListener("click", onDone);
  els.flip.addEventListener("click", flipCamera);
  els.distToggle.addEventListener("change", function () {
    if (els.distToggle.checked) startMotion();
  });

  // אם אין hooks — הצג יומן הדגמה
  if (!window.FocusHLSMapping || typeof window.FocusHLSMapping.saveSubLocation !== "function") {
    logLine("מצב הדגמה: אין hooks מחוברים — לכידות יודפסו כאן כ-JSON.", "ok");
  }

  // התחלה
  startCamera();
  startOrientation();
  refreshStatus();

  // חשיפה מינימלית לשילוב עתידי (למשל אם רוצים לפתוח את המסך תוך העברת שם מיקום)
  window.FocusHLSCameraMapping = {
    setLocation: function (name) { LOC_NAME = name || ""; refreshStatus(); },
    getState: function () { return { heading: state.heading, camReady: state.camReady }; }
  };
})();
</script>
</body>
</html>
