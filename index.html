<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>סקר טופולוגיית BLE — FocusHLS</title>
<!--
  ════════════════════════════════════════════════════════════════════════
  FocusHLS — סקר טופולוגיית תת-מיקומים + טביעת-אצבע BLE.  build = "ble-topo-v1"
  ════════════════════════════════════════════════════════════════════════
  מטרה: להסתובב במבנה, ללכוד "תת-מיקומים" כנקודות ייחוס, ולקבל מפה דו-ממדית
    שאותה אפשר למקם ב-VR כעוגנים למשתמשים. לכל נקודה נשמר:
      - מיקום משוער (x,y במטרים) לפי dead-reckoning (כיוון מצפן + ספירת צעדים)
      - כיוון (heading)
      - טביעת-אצבע BLE: {משדר → RSSI} — לזיהוי/מיקום מאוחר של משתמשים
    בסוף מייצאים JSON לייבוא למערכת ה-VR שלך.

  BLE בדפדפן — קרא לפני שימוש:
    * סריקת BLE כאן משתמשת ב-Web Bluetooth (navigator.bluetooth.requestLEScan).
    * זה עובד רק בכרום לאנדרואיד, ורק אחרי הפעלת דגל ניסיוני:
        chrome://flags/#enable-experimental-web-platform-features  → Enabled → הפעל מחדש.
      וכן: Bluetooth + מיקום (Location) של המכשיר חייבים להיות דלוקים.
    * זה לא עובד בתוך ה-WebView של האפליקציה — זהו כלי סקר עצמאי בכרום.
    * דורש HTTPS (GitHub Pages מספק).
    אם BLE לא זמין — המפה והמיקום עדיין עובדים; טביעת-האצבע פשוט תישמר ריקה.

  אין כאן שום תלות ב-ARCore, ב-LIVE או בקוד הנייטיבי.
-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#0d1117; color:#e6edf3;
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px; background:#161b22; border-bottom:1px solid #30363d; }
  header .title { font-weight:700; font-size:16px; }
  #status { font-size:12.5px; opacity:.9; margin-top:3px; line-height:1.5; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; margin-inline-start:6px; }
  .pill.on  { background:#1f6f3f; color:#d7ffe6; }
  .pill.off { background:#5a1e1e; color:#ffd7d7; }
  #mapWrap { position:relative; flex:1; min-height:0; }
  #map { width:100%; height:100%; display:block; background:#0d1117; touch-action:none; }
  #hint { position:absolute; inset:auto 10px 10px; background:#3d2b12; border:1px solid #7a5b1e;
    color:#ffe6b3; font-size:12.5px; line-height:1.5; padding:9px 11px; border-radius:9px; display:none; }
  #hint.show { display:block; }
  #beacons { position:absolute; top:8px; inset-inline-end:8px; width:190px; max-height:42%; overflow-y:auto;
    background:#0b0f14cc; border:1px solid #30363d; border-radius:9px; padding:6px 8px; font-size:11.5px; direction:ltr; text-align:left; }
  #beacons h4 { margin:0 0 4px; font-size:11px; color:#8b949e; text-align:right; direction:rtl; }
  .brow { display:flex; justify-content:space-between; gap:6px; padding:1px 0; }
  .brow .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .brow .rs { color:#7ee787; font-variant-numeric:tabular-nums; }
  footer { background:#161b22; border-top:1px solid #30363d;
    padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 10px); display:flex; flex-direction:column; gap:8px; }
  #name { width:100%; padding:11px 12px; border-radius:10px; border:1px solid #30363d; background:#0d1117; color:#e6edf3; font-size:15px; text-align:right; }
  .row { display:flex; gap:8px; }
  button { border:none; border-radius:10px; font-size:14px; font-weight:700; padding:12px 8px; color:#fff; flex:1; cursor:pointer; }
  #capture { background:#1f6feb; } #capture:active{ background:#1858c4; }
  #capture:disabled { background:#3a3f47; opacity:.7; }
  .sec { background:#30363d; } .sec:active{ background:#3d444d; }
  .mini { flex:0 0 auto; padding:12px 12px; }
  .toolbar { display:flex; gap:8px; align-items:center; font-size:12px; color:#8b949e; }
  .toolbar input[type=number]{ width:56px; background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:7px; padding:5px 6px; text-align:center; }
  #toast { position:fixed; left:50%; bottom:38%; transform:translateX(-50%); background:#0b0f14e6; border:1px solid #30363d;
    border-radius:11px; padding:11px 16px; font-size:14px; max-width:86vw; text-align:center; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">🗺️ סקר טופולוגיית תת-מיקומים · BLE</div>
    <div id="status">
      חיישנים: <span id="pillSensors" class="pill off">כבויים</span>
      BLE: <span id="pillBle" class="pill off">כבוי</span>
      נקודות: <span id="ptCount">0</span>
    </div>
  </header>

  <div id="mapWrap">
    <canvas id="map"></canvas>
    <div id="beacons"><h4>משדרים נקלטים (RSSI)</h4><div id="beaconList"><div class="brow"><span class="nm">—</span></div></div></div>
    <div id="hint"></div>
  </div>

  <footer>
    <input id="name" type="text" placeholder="שם תת-מיקום (למשל: לובי A / קומה 2)">
    <div class="toolbar">
      <span>אורך צעד (מ'):</span>
      <input id="stride" type="number" min="0.3" max="1.2" step="0.05" value="0.7">
      <span style="flex:1"></span>
      <span id="posTxt">x:0.0 y:0.0</span>
    </div>
    <div class="row">
      <button id="capture" disabled>לכוד תת-מיקום</button>
      <button id="undo" class="sec mini">בטל אחרון</button>
    </div>
    <div class="row">
      <button id="sensors" class="sec">הפעל חיישנים</button>
      <button id="bleBtn" class="sec">הפעל BLE</button>
      <button id="reset" class="sec">אפס</button>
      <button id="export" class="sec">ייצוא JSON</button>
    </div>
  </footer>
</div>
<div id="toast"></div>

<script>
"use strict";
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var els = {
    map:$("map"), status:$("status"), pillSensors:$("pillSensors"), pillBle:$("pillBle"),
    ptCount:$("ptCount"), beaconList:$("beaconList"), hint:$("hint"), name:$("name"),
    stride:$("stride"), posTxt:$("posTxt"), capture:$("capture"), undo:$("undo"),
    sensors:$("sensors"), bleBtn:$("bleBtn"), reset:$("reset"), export:$("export"), toast:$("toast")
  };
  var ctx = els.map.getContext("2d");

  var S = {
    heading:0, headingRaw:null, haveOrient:false,
    pos:{x:0,y:0}, path:[{x:0,y:0}], points:[],
    stride:0.7, lastPeak:0
  };
  var BLE = { supported: !!(navigator.bluetooth && navigator.bluetooth.requestLEScan),
              scanning:false, scan:null, beacons:{} };

  // ── עזרים ─────────────────────────────────────────────────────────────
  function toast(m, ms){ els.toast.textContent=m; els.toast.classList.add("show");
    clearTimeout(toast._t); toast._t=setTimeout(function(){els.toast.classList.remove("show");}, ms||2200); }
  function hint(m){ els.hint.textContent=m; els.hint.classList.toggle("show", !!m); }

  // ── חיישני כיוון + תנועה (dead-reckoning) ────────────────────────────
  function computeHeading(ev){
    var h=null;
    if(typeof ev.webkitCompassHeading==="number") h=ev.webkitCompassHeading;
    else if(ev.alpha!=null) h=360-ev.alpha;
    if(h==null) return null;
    var so=(screen.orientation&&typeof screen.orientation.angle==="number")?screen.orientation.angle:(window.orientation||0);
    h=(h+so)%360; if(h<0) h+=360; return h;
  }
  function onOrient(ev){
    var h=computeHeading(ev); if(h==null) return;
    if(S.headingRaw==null) S.headingRaw=h;
    var diff=((h-S.headingRaw+540)%360)-180; S.headingRaw=(S.headingRaw+diff*0.25+360)%360;
    S.heading=S.headingRaw; S.haveOrient=true;
  }
  function onMotion(ev){
    var a=ev.accelerationIncludingGravity||ev.acceleration; if(!a) return;
    var mag=Math.sqrt((a.x||0)*(a.x||0)+(a.y||0)*(a.y||0)+(a.z||0)*(a.z||0));
    var now=Date.now();
    if(mag>12 && (now-S.lastPeak)>300){
      S.lastPeak=now;
      var rad=(S.heading||0)*Math.PI/180;
      S.pos.x+=Math.sin(rad)*S.stride; S.pos.y+=Math.cos(rad)*S.stride;
      S.path.push({x:S.pos.x,y:S.pos.y});
      if(S.path.length>4000) S.path.shift();
    }
  }
  function enableSensors(){
    var DOE=window.DeviceOrientationEvent, DME=window.DeviceMotionEvent;
    function bindO(){ if("ondeviceorientationabsolute" in window) window.addEventListener("deviceorientationabsolute",onOrient,true);
      window.addEventListener("deviceorientation",onOrient,true); }
    function bindM(){ window.addEventListener("devicemotion",onMotion,true); }
    var need=[];
    if(DOE&&typeof DOE.requestPermission==="function") need.push(DOE.requestPermission().then(function(r){ if(r==="granted") bindO(); }));
    else bindO();
    if(DME&&typeof DME.requestPermission==="function") need.push(DME.requestPermission().then(function(r){ if(r==="granted") bindM(); }));
    else bindM();
    Promise.all(need).catch(function(){});
    els.pillSensors.className="pill on"; els.pillSensors.textContent="פעילים";
    els.capture.disabled=false;
    toast("חיישנים פעילים — התחל ללכת, המיקום יתעדכן");
  }

  // ── BLE (Web Bluetooth advertisement scanning) ───────────────────────
  function bleErr(e){
    var n=(e&&e.name)||"";
    if(n==="NotFoundError") return "סריקת BLE בוטלה או שאין הרשאה. ודא Bluetooth+מיקום דלוקים ואשר את הבקשה.";
    if(n==="NotSupportedError"||n==="TypeError") return "requestLEScan לא זמין — הפעל chrome://flags/#enable-experimental-web-platform-features, ורענן.";
    if(n==="SecurityError") return "נדרש HTTPS ולחיצת משתמש. ודא שהעמוד ב-https ולחץ שוב על 'הפעל BLE'.";
    if(n==="InvalidStateError") return "המתאם Bluetooth כבוי — הדלק Bluetooth ונסה שוב.";
    return "שגיאת BLE: "+n;
  }
  function onAdv(ev){
    if(!BLE.scanning) return;
    var id=ev.device.id||ev.device.name||"?";
    BLE.beacons[id]={ id:id, name:ev.device.name||"", rssi:ev.rssi, tx:ev.txPower, ts:Date.now() };
  }
  function startBle(){
    if(!BLE.supported){ hint("הדפדפן לא תומך ב-requestLEScan. הפעל chrome://flags/#enable-experimental-web-platform-features → Enabled → הפעל מחדש את כרום."); return; }
    if(BLE.scanning){ stopBle(); return; }
    navigator.bluetooth.requestLEScan({ acceptAllAdvertisements:true, keepRepeatedDevices:true })
      .then(function(scan){
        BLE.scan=scan; BLE.scanning=true;
        navigator.bluetooth.addEventListener("advertisementreceived", onAdv);
        els.pillBle.className="pill on"; els.pillBle.textContent="סורק";
        els.bleBtn.textContent="עצור BLE"; hint("");
        toast("סריקת BLE החלה");
      })
      .catch(function(e){ hint(bleErr(e)); });
  }
  function stopBle(){
    try{ if(BLE.scan) BLE.scan.stop(); }catch(e){}
    BLE.scanning=false; els.pillBle.className="pill off"; els.pillBle.textContent="כבוי"; els.bleBtn.textContent="הפעל BLE";
  }
  function currentFingerprint(){
    var now=Date.now(), out=[];
    for(var k in BLE.beacons){ var b=BLE.beacons[k]; if(now-b.ts<=4000) out.push({ id:b.id, name:b.name, rssi:b.rssi }); }
    out.sort(function(a,b){ return b.rssi-a.rssi; });
    return out;
  }
  function renderBeacons(){
    var fp=currentFingerprint();
    if(!fp.length){ els.beaconList.innerHTML='<div class="brow"><span class="nm">'+(BLE.scanning?"מחפש…":"—")+'</span></div>'; return; }
    var html=""; for(var i=0;i<Math.min(fp.length,12);i++){ var b=fp[i];
      html+='<div class="brow"><span class="nm">'+(b.name||b.id).slice(0,16)+'</span><span class="rs">'+b.rssi+'</span></div>'; }
    els.beaconList.innerHTML=html;
  }

  // ── לכידה / ניהול נקודות ─────────────────────────────────────────────
  function capture(){
    var nm=(els.name.value||"").trim();
    if(!nm){ toast("הזן שם תת-מיקום"); els.name.focus(); return; }
    var rec={ name:nm, x:Math.round(S.pos.x*100)/100, y:Math.round(S.pos.y*100)/100,
              heading:S.haveOrient?Math.round(S.heading*10)/10:null, ts:Date.now(), ble:currentFingerprint() };
    S.points.push(rec); els.ptCount.textContent=S.points.length; els.name.value="";
    toast('נלכד "'+nm+'"  ·  BLE: '+rec.ble.length+(rec.ble.length?("  ·  חזק: "+rec.ble[0].rssi):""));
  }
  function undo(){ if(!S.points.length){ toast("אין נקודות"); return; } var p=S.points.pop(); els.ptCount.textContent=S.points.length; toast("בוטל: "+p.name); }
  function resetAll(){ S.pos={x:0,y:0}; S.path=[{x:0,y:0}]; S.points=[]; S.headingRaw=null; els.ptCount.textContent=0; toast("אופס — נקודת (0,0) חדשה"); }
  function exportJson(){
    var data={ createdAt:new Date().toISOString(), unit:"meters", origin:"first-start", points:S.points };
    var txt=JSON.stringify(data,null,2);
    try{
      var blob=new Blob([txt],{type:"application/json"});
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download="ble-topology-"+Date.now()+".json"; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
      toast("יוצא JSON ("+S.points.length+" נקודות)");
    }catch(e){
      if(navigator.clipboard){ navigator.clipboard.writeText(txt); toast("הועתק ל-clipboard"); }
      else toast("שגיאת ייצוא");
    }
  }

  // ── ציור המפה (top-down) ─────────────────────────────────────────────
  function resize(){ var r=els.map.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    els.map.width=r.width*dpr; els.map.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  function bounds(){
    var xs=[S.pos.x],ys=[S.pos.y];
    S.path.forEach(function(p){xs.push(p.x);ys.push(p.y);});
    S.points.forEach(function(p){xs.push(p.x);ys.push(p.y);});
    var minX=Math.min.apply(null,xs),maxX=Math.max.apply(null,xs),minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
    if(maxX-minX<4){var c=(minX+maxX)/2;minX=c-2;maxX=c+2;} if(maxY-minY<4){var c2=(minY+maxY)/2;minY=c2-2;maxY=c2+2;}
    return {minX:minX,maxX:maxX,minY:minY,maxY:maxY};
  }
  function draw(){
    var w=els.map.clientWidth,h=els.map.clientHeight; ctx.clearRect(0,0,w,h);
    var b=bounds(), pad=40;
    var sx=(w-pad*2)/(b.maxX-b.minX), sy=(h-pad*2)/(b.maxY-b.minY);
    var scale=Math.max(8,Math.min(100,Math.min(sx,sy)));
    var cx=(b.minX+b.maxX)/2, cy=(b.minY+b.maxY)/2;
    function X(wx){ return w/2+(wx-cx)*scale; }
    function Y(wy){ return h/2-(wy-cy)*scale; }
    // רשת 1 מ'
    ctx.lineWidth=1; ctx.strokeStyle="#161b22"; ctx.beginPath();
    for(var gx=Math.ceil(b.minX);gx<=Math.floor(b.maxX);gx++){ ctx.moveTo(X(gx),0); ctx.lineTo(X(gx),h); }
    for(var gy=Math.ceil(b.minY);gy<=Math.floor(b.maxY);gy++){ ctx.moveTo(0,Y(gy)); ctx.lineTo(w,Y(gy)); }
    ctx.stroke();
    // מסלול
    if(S.path.length>1){ ctx.strokeStyle="#30475e"; ctx.lineWidth=2; ctx.beginPath();
      ctx.moveTo(X(S.path[0].x),Y(S.path[0].y));
      for(var i=1;i<S.path.length;i++) ctx.lineTo(X(S.path[i].x),Y(S.path[i].y)); ctx.stroke(); }
    // נקודות תת-מיקום
    S.points.forEach(function(p,idx){
      var px=X(p.x),py=Y(p.y);
      ctx.fillStyle="#1f6feb"; ctx.beginPath(); ctx.arc(px,py,7,0,7); ctx.fill();
      ctx.strokeStyle="#0d1117"; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle="#e6edf3"; ctx.font="12px sans-serif"; ctx.textAlign="right"; ctx.textBaseline="middle";
      ctx.fillText(p.name,px-11,py);
    });
    // מיקום נוכחי + חץ כיוון
    var mx=X(S.pos.x),my=Y(S.pos.y);
    ctx.fillStyle="#2ea043"; ctx.beginPath(); ctx.arc(mx,my,6,0,7); ctx.fill();
    if(S.haveOrient){ var rad=S.heading*Math.PI/180, dx=Math.sin(rad), dy=-Math.cos(rad);
      ctx.strokeStyle="#2ea043"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(mx+dx*22,my+dy*22); ctx.stroke(); }
    els.posTxt.textContent="x:"+S.pos.x.toFixed(1)+" y:"+S.pos.y.toFixed(1);
    renderBeacons();
    requestAnimationFrame(draw);
  }

  // ── חיווט ─────────────────────────────────────────────────────────────
  els.sensors.addEventListener("click", enableSensors);
  els.bleBtn.addEventListener("click", startBle);
  els.capture.addEventListener("click", capture);
  els.undo.addEventListener("click", undo);
  els.reset.addEventListener("click", resetAll);
  els.export.addEventListener("click", exportJson);
  els.stride.addEventListener("change", function(){ var v=parseFloat(els.stride.value); if(v>0) S.stride=v; });
  window.addEventListener("resize", resize);

  if(!BLE.supported) hint("שים לב: requestLEScan לא זמין בדפדפן הזה. הפעל chrome://flags/#enable-experimental-web-platform-features → Enabled → הפעל מחדש. (המפה והמיקום עובדים גם בלי זה — טביעת-האצבע פשוט תישמר ריקה.)");

  resize(); requestAnimationFrame(draw);
})();
</script>
</body>
</html>
