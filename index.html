<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>בדיקת WebXR AR — FocusHLS</title>
<!--
  בדיקת היתכנות WebXR AR (אותו מנוע שמאחורי NetLens — רץ על ARCore באנדרואיד).
  מטרה: לקבוע חד-משמעית אם AR עם עיגון-עולם עובד על המכשיר הזה.
  דורש: Chrome לאנדרואיד (Brave לרוב גם), HTTPS, ו-"Google Play Services for AR" מותקן.
  אם ARCore שבור על המכשיר (באג 1.54) — הפתיחה תיכשל והשגיאה תוצג כאן.
-->
<style>
  html,body{ margin:0; height:100%; background:#0d1117; color:#e6edf3;
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif; overflow:hidden; }
  #ui{ position:fixed; z-index:10; inset:0; display:flex; flex-direction:column; }
  #head{ padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px; }
  #head .t{ font-weight:800; font-size:18px; }
  #log{ flex:1; margin:8px 12px; padding:10px 12px; overflow-y:auto; background:#000a; border:1px solid #30363d;
    border-radius:10px; font-size:13px; line-height:1.6; direction:ltr; text-align:left; }
  #log .ok{ color:#7ee787; } #log .err{ color:#ff7b72; } #log .info{ color:#79c0ff; }
  #start{ margin:0 12px calc(env(safe-area-inset-bottom,0px) + 16px); padding:16px; border:none; border-radius:14px;
    background:#1f6feb; color:#fff; font-size:18px; font-weight:800; }
  #start:active{ background:#1858c4; } #start:disabled{ background:#3a3f47; opacity:.7; }
  canvas{ position:fixed; inset:0; }
</style>
</head>
<body>
<div id="ui">
  <div id="head"><div class="t">🧪 בדיקת WebXR AR (מנוע NetLens)</div>
    <div style="font-size:12.5px;opacity:.85;margin-top:4px">אחרי שהסשן נפתח: הזז את הטלפון לאט כדי לזהות את הרצפה, ואז הקש להצבת קובייה.</div>
  </div>
  <div id="log"></div>
  <button id="start">התחל בדיקת AR</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';

var logEl = document.getElementById('log');
function log(msg, cls){ var d=document.createElement('div'); if(cls) d.className=cls; d.textContent=msg; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
window.addEventListener('error', function(e){ log('JS error: '+(e.message||e), 'err'); });
window.addEventListener('unhandledrejection', function(e){ log('Promise rejected: '+((e.reason&&e.reason.message)||e.reason), 'err'); });

log('דף נטען. בודק סביבה…', 'info');
log('secure context (HTTPS): '+ (window.isSecureContext ? 'כן' : 'לא!'), window.isSecureContext?'ok':'err');
log('navigator.xr קיים: '+ (!!navigator.xr), navigator.xr?'ok':'err');

var camera, scene, renderer, controller, reticle, hitTestSource=null, hitReq=false, planeSeen=false, placed=0;

function init(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 20);
  var light=new THREE.HemisphereLight(0xffffff,0xbbbbff,1); light.position.set(0.5,1,0.25); scene.add(light);
  renderer=new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(innerWidth,innerHeight); renderer.xr.enabled=true;
  document.body.appendChild(renderer.domElement);

  var geo=new THREE.BoxGeometry(0.12,0.12,0.12);
  function onSelect(){ if(reticle.visible){
    var m=new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ color:0x1f6feb|((Math.random()*0xffffff)&0x00ff00) }));
    m.position.setFromMatrixPosition(reticle.matrix); m.position.y+=0.06; scene.add(m); placed++;
    log('✓ הוצבה קובייה #'+placed+' — עיגון-עולם עובד!', 'ok');
  } }
  controller=renderer.xr.getController(0); controller.addEventListener('select', onSelect); scene.add(controller);

  reticle=new THREE.Mesh(new THREE.RingGeometry(0.08,0.1,32).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color:0x2ea043}));
  reticle.matrixAutoUpdate=false; reticle.visible=false; scene.add(reticle);

  renderer.setAnimationLoop(render);
  window.addEventListener('resize', function(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
}

function render(t, frame){
  if(frame){
    var ref=renderer.xr.getReferenceSpace(), session=renderer.xr.getSession();
    if(!hitReq){ hitReq=true;
      session.requestReferenceSpace('viewer').then(function(vs){
        session.requestHitTestSource({ space:vs }).then(function(s){ hitTestSource=s; log('hit-test source מוכן — מזיז לזיהוי מישור…', 'info'); })
        .catch(function(e){ log('hit-test source נכשל: '+(e.message||e), 'err'); });
      });
      session.addEventListener('end', function(){ hitReq=false; hitTestSource=null; log('סשן AR הסתיים.', 'info'); });
    }
    if(hitTestSource){
      var hits=frame.getHitTestResults(hitTestSource);
      if(hits.length){ var pose=hits[0].getPose(ref); reticle.visible=true; reticle.matrix.fromArray(pose.transform.matrix);
        if(!planeSeen){ planeSeen=true; log('✓ זוהה מישור (רצפה) — הקש כדי להניח קובייה.', 'ok'); }
      } else reticle.visible=false;
    }
  }
  renderer.render(scene,camera);
}

async function startAR(){
  var btn=document.getElementById('start');
  if(!navigator.xr){ log('WebXR לא נתמך בדפדפן (navigator.xr חסר). נסה Chrome עדכני.', 'err'); return; }
  btn.disabled=true; btn.textContent='פותח AR…';
  var supported=false;
  try{ supported=await navigator.xr.isSessionSupported('immersive-ar'); }catch(e){ log('isSessionSupported נכשל: '+(e.message||e), 'err'); }
  log('immersive-ar נתמך: '+supported, supported?'ok':'err');
  if(!supported){ log('AR לא זמין. סיבות אפשריות: Google Play Services for AR לא מותקן, או שהמכשיר לא נתמך ע"י ARCore.', 'err'); btn.disabled=false; btn.textContent='נסה שוב'; return; }
  try{
    var session=await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures:['hit-test'], optionalFeatures:['dom-overlay','local-floor'], domOverlay:{ root:document.getElementById('ui') }
    });
    log('✓ סשן AR נפתח! ממתין לזיהוי מישור…', 'ok');
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    btn.style.display='none';
  }catch(e){
    log('✗ פתיחת AR נכשלה: '+(e.name||'')+' — '+(e.message||e), 'err');
    log('אם זו FatalException/סנסור — זה אותו באג ARCore 1.54 שראינו קודם.', 'err');
    btn.disabled=false; btn.textContent='נסה שוב';
  }
}

document.getElementById('start').addEventListener('click', startAR);

// אתחול מוקדם + בדיקת תמיכה ראשונית
try{ init(); log('three.js אותחל בהצלחה.', 'ok'); }catch(e){ log('כשל באתחול three.js: '+(e.message||e), 'err'); }
if(navigator.xr){ navigator.xr.isSessionSupported('immersive-ar').then(function(s){ log('בדיקה ראשונית — immersive-ar נתמך: '+s, s?'ok':'err'); }).catch(function(){}); }
</script>
</body>
</html>
